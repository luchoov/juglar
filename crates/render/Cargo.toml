[package]
name = "juglar-render"
description = "GPU rendering for Juglar on wgpu. OS-agnostic: takes any window handle and plain numbers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
juglar-signals = { path = "../signals" }
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl"] }

# Only the graphics APIs each platform needs. Windows gets DirectX 12, which
# cost the least CPU and memory on the GPUs measured so far, plus Vulkan as a
# fallback (see `adapter_rank`). OpenGL is left out everywhere.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "dx12"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["webgpu"] }

[dev-dependencies]
# Waits for the GPU in the limiter's tests.
pollster = "1.0"
